name: Update measurement data

on:
  schedule:
    # 毎週日曜 11:00 JST（= 日曜 02:00 UTC）に実行
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-measurement-data
  cancel-in-progress: false

jobs:
  update-data:
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Export data from HealthPlanet
        run: npm run export:data
        env:
          HEALTHPLANET_ACCESS_TOKEN: ${{ secrets.HEALTHPLANET_ACCESS_TOKEN }}

      - name: Commit and push if changed
        id: commit
        run: |
          if git diff --quiet -- public/measurement-data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/measurement-data.json
          git commit -m "chore: update measurement data"
          git push origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  ci:
    needs: update-data
    if: needs.update-data.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.update-data.outputs.commit }}

  deploy:
    needs: [update-data, ci]
    if: needs.update-data.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.update-data.outputs.commit }}
    secrets:
      HEALTHPLANET_ACCESS_TOKEN: ${{ secrets.HEALTHPLANET_ACCESS_TOKEN }}
